spring.application.name=project

#Config datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db-project?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234567a

#Config JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT config
jwt.secret=base-spring-boot-student-project-secret-key
jwt.access-token-expiration-minutes=30
jwt.refresh-token-expiration-days=7

# Logging
logging.level.com.example.project=INFO
